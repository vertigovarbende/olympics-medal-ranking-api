spring.application.name=olympic-ranking
spring.datasource.url=jdbc:h2:mem:olympics
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


logging.level.com.huawei.olympic_ranking=DEBUG

# OpenAPI: yanitlar yalnizca arayuzlerdeki @ApiResponses ile belgelenir (GlobalExceptionHandler yanitlari otomatik eklenmez)
springdoc.override-with-generic-response=false
